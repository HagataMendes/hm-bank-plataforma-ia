<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plataforma de IA · HM Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#00113B; --navy-900:#001E61; --navy-800:#0A2C74;
  --azure:#00A0E3; --azure-dim:#0B7FB5;
  --bronze:#A9824C; --bronze-dim:#8C6B3E;
  --petrol:#0E5C52; --petrol-dim:#093D36;
  --success:#2E9E6B; --danger:#C0392B;
  --bg:#EEF1F6; --panel:#FFFFFF; --panel-2:#F7F8FB; --line:#DFE3EC; --line-soft:#EAEDF3;
  --ink:#0B1220; --ink-soft:#586074; --ink-faint:#94A0B4;
  --shadow:0 4px 18px rgba(10,25,60,.07), 0 1px 3px rgba(10,25,60,.05);
  --r-sm:8px; --r-md:11px; --r-lg:15px; --r-pill:999px;
  --glow:none;
  --font-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --glass-bg:rgba(255,255,255,.68); --glass-bg-2:rgba(222,240,252,.62); --glass-border:rgba(10,25,60,.09);
  --sb-grad-1:rgba(234,239,250,.9); --sb-grad-2:rgba(221,229,244,.95); --sb-border:rgba(10,25,60,.09);
  --sb-ink:#0B1220; --sb-ink-soft:#57628A; --sb-ink-faint:#8791AE;
  --sb-surface:rgba(10,25,60,.045); --sb-surface-2:rgba(10,25,60,.085); --sb-edge-glow:rgba(0,160,227,.4);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#04070F; --panel:#0A1120; --panel-2:#0E1628; --line:#1B2540; --line-soft:#141D34;
  --ink:#EBEFF8; --ink-soft:#96A2BE; --ink-faint:#57678A;
  --shadow:0 8px 28px rgba(0,0,0,.5), 0 0 0 1px rgba(0,160,227,.02);
  --glow:0 0 0 1px rgba(0,160,227,.16), 0 0 22px rgba(0,160,227,.06);
  --glass-bg:rgba(12,19,36,.6); --glass-bg-2:rgba(14,38,66,.58); --glass-border:rgba(255,255,255,.09);
  --sb-grad-1:rgba(0,17,59,.82); --sb-grad-2:rgba(0,11,36,.9); --sb-border:rgba(255,255,255,.07);
  --sb-ink:#ffffff; --sb-ink-soft:#9AAAD1; --sb-ink-faint:#5E6E92;
  --sb-surface:rgba(255,255,255,.04); --sb-surface-2:rgba(255,255,255,.08); --sb-edge-glow:rgba(0,160,227,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04070F; --panel:#0A1120; --panel-2:#0E1628; --line:#1B2540; --line-soft:#141D34;
    --ink:#EBEFF8; --ink-soft:#96A2BE; --ink-faint:#57678A;
    --shadow:0 8px 28px rgba(0,0,0,.5), 0 0 0 1px rgba(0,160,227,.02);
    --glow:0 0 0 1px rgba(0,160,227,.16), 0 0 22px rgba(0,160,227,.06);
    --glass-bg:rgba(12,19,36,.6); --glass-bg-2:rgba(14,38,66,.58); --glass-border:rgba(255,255,255,.09);
    --sb-grad-1:rgba(0,17,59,.82); --sb-grad-2:rgba(0,11,36,.9); --sb-border:rgba(255,255,255,.07);
    --sb-ink:#ffffff; --sb-ink-soft:#9AAAD1; --sb-ink-faint:#5E6E92;
    --sb-surface:rgba(255,255,255,.04); --sb-surface-2:rgba(255,255,255,.08); --sb-edge-glow:rgba(0,160,227,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased; position:relative;}
body{background:radial-gradient(1000px 640px at 12% -10%, rgba(0,160,227,.07), transparent 58%), radial-gradient(820px 560px at 102% 6%, rgba(0,30,97,.05), transparent 55%), var(--bg);}
:root[data-theme="dark"] body{background:radial-gradient(1100px 620px at 14% -8%, rgba(0,160,227,.1), transparent 60%), radial-gradient(900px 520px at 100% 0%, rgba(10,44,116,.4), transparent 55%), var(--bg);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:radial-gradient(1100px 620px at 14% -8%, rgba(0,160,227,.1), transparent 60%), radial-gradient(900px 520px at 100% 0%, rgba(10,44,116,.4), transparent 55%), var(--bg);}}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(80,100,140,.14) 1px, transparent 1px);
  background-size:24px 24px; opacity:.35;
}
:root[data-theme="dark"] body::before{background-image:radial-gradient(rgba(150,175,220,.16) 1px, transparent 1px); opacity:.28;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{background-image:radial-gradient(rgba(150,175,220,.16) 1px, transparent 1px); opacity:.28;}}
#root{height:100%; display:flex; position:relative; z-index:1;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
button{font-family:inherit;}
svg{display:block;}
:focus-visible{outline:2px solid var(--azure); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;} }

.backdrop{display:none; position:fixed; inset:0; background:rgba(3,8,20,.5); z-index:15;}
.backdrop.open{display:block;}
.sidebar{
  width:348px; min-width:348px; position:relative;
  background:linear-gradient(180deg, var(--sb-grad-1), var(--sb-grad-2));
  -webkit-backdrop-filter:blur(26px) saturate(160%); backdrop-filter:blur(26px) saturate(160%);
  color:var(--sb-ink); display:flex; flex-direction:column; padding:0;
  border-right:1px solid var(--sb-border); transition:background .2s;
}
.sidebar::after{content:""; position:absolute; top:0; right:-1px; bottom:0; width:1px; background:linear-gradient(180deg, transparent 5%, var(--sb-edge-glow) 45%, transparent 95%); pointer-events:none;}

/* ---- fake "open apps" taskbar (Outlook/Excel/PowerPoint), just for corporate flavor ---- */
.corp-taskbar{display:flex; align-items:center; gap:6px; padding:9px 10px 8px; padding-top:calc(9px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--sb-border); overflow-x:auto; overflow-y:hidden; flex-shrink:0; scrollbar-width:thin;}
.corp-taskbar::-webkit-scrollbar{height:0;}
.corp-tab{display:flex; align-items:center; gap:6px; padding:5px 10px 5px 5px; border-radius:8px; background:var(--sb-surface); border:1px solid var(--sb-border); flex-shrink:0; cursor:default; transition:background .15s,border-color .15s; -webkit-user-select:none; user-select:none;}
.corp-tab:hover{background:var(--sb-surface-2);}
.corp-tab.active{background:rgba(0,160,227,.14); border-color:rgba(0,160,227,.4);}
.corp-tab-icon{width:19px; height:19px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; color:#fff; flex-shrink:0; box-shadow:0 1px 2px rgba(0,0,0,.18);}
.corp-tab-meta{display:flex; flex-direction:column; min-width:0; line-height:1.25;}
.corp-tab-label{font-size:10.5px; font-weight:600; color:var(--sb-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px;}
.corp-tab-sub{font-size:8.5px; color:var(--sb-ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px;}

.sidebar-body{display:flex; flex-direction:row; flex:1; min-height:0;}

.icon-rail{width:68px; min-width:68px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:13px 6px; background:linear-gradient(180deg, var(--sb-surface), transparent 40%); border-right:1px solid var(--sb-border);}
.rail-logo{width:32px; height:32px; border-radius:9px; margin-bottom:12px; flex-shrink:0; box-shadow:0 2px 8px -2px rgba(0,160,227,.5);}
.rail-item{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; width:100%; padding:8px 2px 7px; border-radius:12px; background:none; border:none; cursor:pointer; color:var(--sb-ink-faint); transition:background .15s,color .15s,transform .15s; flex-shrink:0;}
.rail-item:hover{background:var(--sb-surface-2); color:var(--sb-ink-soft); transform:translateY(-1px);}
.rail-item.active{background:rgba(0,160,227,.16); color:var(--azure);}
.rail-item.active::before{content:""; position:absolute; left:-6px; top:50%; transform:translateY(-50%); width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--azure);}
:root[data-theme="dark"] .rail-item.active{box-shadow:var(--glow);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rail-item.active{box-shadow:var(--glow);}}
.rail-item.decorative{opacity:.42; cursor:default;}
.rail-item.decorative:hover{background:none; color:var(--sb-ink-faint); transform:none;}
.rail-item-icon{position:relative; display:flex;}
.rail-item-label{font-size:8.8px; font-weight:600; letter-spacing:.01em;}
.rail-badge{position:absolute; top:-5px; right:-8px; min-width:15px; height:15px; padding:0 4px; border-radius:999px; background:var(--danger); color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--sb-grad-1);}
.rail-divider{width:60%; height:1px; background:var(--sb-border); margin:6px 0 8px; flex-shrink:0;}

.sidebar-panel{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; padding:14px 11px 15px; overflow:hidden;}

.agenda-mini-item{display:flex; align-items:center; gap:9px; width:100%; padding:7px 8px; border-radius:9px; background:none; border:none; cursor:pointer; text-align:left; color:inherit; transition:background .15s;}
.agenda-mini-item:hover{background:var(--sb-surface);}
.agenda-mini-time{font-size:11px; font-weight:700; color:var(--sb-ink-soft); width:36px; flex-shrink:0; font-variant-numeric:tabular-nums;}
.agenda-mini-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.agenda-mini-title{font-size:12px; color:var(--sb-ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}
.brand{display:flex; align-items:center; gap:9px; padding:1px 4px 3px;}
.mark-avatar{border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--azure) 0%, var(--navy-800) 100%);}
.brand-text b{display:block; font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:-.2px; color:var(--sb-ink);}
.brand-text span{display:block; font-size:10.5px; color:var(--sb-ink-soft); margin-top:1px;}
.sidebar-close{display:none; margin-left:auto; width:28px; height:28px; border-radius:7px; border:none; background:var(--sb-surface-2); color:var(--sb-ink); align-items:center; justify-content:center; cursor:pointer;}

.status-line{display:flex; align-items:center; gap:6px; padding:3px 6px 13px; font-size:10.5px; color:var(--sb-ink-faint);}
.live-dot{width:5px; height:5px; border-radius:50%; background:var(--success); flex-shrink:0; box-shadow:0 0 0 2px rgba(46,158,107,.2); animation:live-pulse 2.4s infinite;}
@keyframes live-pulse{0%,100%{opacity:1;} 50%{opacity:.4;}}

.search-box{display:flex; align-items:center; gap:7px; padding:7px 9px; margin-bottom:9px; background:var(--sb-surface); border:1px solid var(--sb-border); border-radius:var(--r-sm); transition:border-color .15s;}
.search-box:focus-within{border-color:rgba(0,160,227,.5);}
.search-box input{flex:1; min-width:0; background:transparent; border:none; outline:none; color:var(--sb-ink); font-size:12px;}
.search-box input::placeholder{color:var(--sb-ink-faint);}
.search-box svg{color:var(--sb-ink-faint); flex-shrink:0;}
.search-kbd{font-size:10px; padding:2px 6px; border-radius:5px; background:var(--sb-surface-2); color:var(--sb-ink-soft); font-family:'IBM Plex Mono',monospace; flex-shrink:0;}

.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding-block:56px 20px; color:var(--ink-soft); animation:rise .4s ease both;}
.empty-state .empty-title{font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink);}
.empty-state .empty-sub{font-size:12.5px; margin-top:3px; max-width:320px;}

.greet-block{display:flex; flex-direction:column; gap:14px; padding-top:18px; animation:rise .4s ease both;}
.suggestion-row{display:flex; flex-wrap:wrap; gap:9px; padding-left:42px;}
@media (max-width:640px){.suggestion-row{padding-left:0;}}
.suggestion-chip{
  position:relative; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-pill); padding:8px 14px;
  font-size:12.5px; color:var(--ink-soft); cursor:pointer; text-align:left; transition:background .15s,border-color .15s,color .15s,transform .15s,box-shadow .15s;
  -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 1px 2px rgba(10,25,60,.04);
}
.suggestion-chip:hover{background:rgba(0,160,227,.1); border-color:rgba(0,160,227,.45); color:var(--ink); transform:translateY(-1px); box-shadow:0 4px 14px -6px rgba(0,160,227,.45);}
.suggestion-chip:active{transform:translateY(0);}

.new-chat{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; padding:8px 12px; background:var(--azure); border:none; color:#00152E; border-radius:var(--r-sm); font-size:12.5px; font-weight:700; cursor:pointer; margin-bottom:12px; transition:filter .15s,background .15s;}
.new-chat:hover{filter:brightness(1.08);}
.new-chat.done{background:var(--success); color:#04230F;}

.beto-row{display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:10px; cursor:pointer; background:var(--sb-surface); border:1px solid var(--sb-border); margin-bottom:12px; transition:background .15s,border-color .15s; width:100%; text-align:left; color:inherit;}
.beto-row:hover{background:var(--sb-surface-2);}
.beto-row.active{background:rgba(0,160,227,.15); border-color:rgba(0,160,227,.4);}
.row-meta{flex:1; min-width:0;}
.row-name{font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; color:var(--sb-ink);}
.row-sub{font-size:10.5px; color:var(--sb-ink-faint); margin-top:1px;}
.row-right{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex-shrink:0;}

.nav-scroll{flex:1; overflow-y:auto; margin:0 -4px; padding:0 4px;}
.group{margin-bottom:2px;}
.group-head{display:flex; align-items:center; justify-content:space-between; padding:7px 6px; cursor:pointer; user-select:none; border-radius:7px; background:none; border:none; width:100%; color:inherit;}
.group-head:hover{background:var(--sb-surface);}
.group-head-l{display:flex; align-items:center; gap:7px;}
.group-dot{width:6px; height:6px; border-radius:2px;}
.group-dot.tech{background:var(--azure);}
.group-dot.biz{background:var(--petrol);}
.group-title{font-size:10px; letter-spacing:.06em; color:var(--sb-ink-faint); font-weight:600;}
.chev{color:var(--sb-ink-faint); transition:transform .18s; flex-shrink:0;}
.chev.collapsed{transform:rotate(-90deg);}
.agent-list{display:flex; flex-direction:column; gap:0px; margin-top:1px; margin-bottom:6px; overflow:hidden;}

.agent{display:flex; align-items:center; gap:8px; padding:5px 7px 5px 12px; border-radius:7px; cursor:pointer; transition:background .15s; background:none; border:none; width:100%; text-align:left; color:inherit;}
.agent:hover{background:var(--sb-surface);}
.agent.active{background:rgba(0,160,227,.13);}
:root[data-theme="dark"] .agent.active, :root[data-theme="dark"] .beto-row.active{box-shadow:var(--glow);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .agent.active, :root:not([data-theme="light"]) .beto-row.active{box-shadow:var(--glow);}}
.agent-icon{width:21px; height:21px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff;}
.agent-name{font-size:12px; font-weight:500; color:var(--sb-ink);}
.agent-sub{font-size:10px; color:var(--sb-ink-faint);}
.latency-chip{font-size:9px; color:var(--sb-ink-faint); font-variant-numeric:tabular-nums;}

.history-wrap{margin-top:1px;}
.history-item{padding:6px 8px; border-radius:7px; font-size:12px; color:var(--sb-ink-soft); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background .15s; width:100%; text-align:left; background:none; border:none; display:block;}
.history-item:hover{background:var(--sb-surface);}
.history-item.active{background:var(--sb-surface-2); color:var(--sb-ink);}

.dm-row{display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:10px; width:100%; cursor:default; transition:background .15s;}
.dm-row:hover{background:var(--sb-surface);}
.dm-avatar{position:relative; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; flex-shrink:0; box-shadow:0 1px 3px rgba(0,0,0,.16);}
.dm-meta{flex:1; min-width:0;}
.dm-name{font-size:12px; font-weight:600; color:var(--sb-ink); display:flex; align-items:center; gap:6px;}
.dm-preview{font-size:10.5px; color:var(--sb-ink-faint); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dm-time{font-size:9.5px; color:var(--sb-ink-faint); flex-shrink:0; align-self:flex-start; margin-top:1px;}
.dm-unread{min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--azure); color:#00152E; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; align-self:center; box-shadow:0 0 0 2px rgba(0,160,227,.2);}

.sidebar-foot{display:flex; align-items:center; gap:9px; padding-top:11px; margin-top:8px; border-top:1px solid var(--sb-border);}
.foot-avatar{width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--azure),var(--navy-800)); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;}
.sidebar-foot .who{font-size:12px; line-height:1.35; min-width:0;}
.sidebar-foot .who b{display:block; font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--sb-ink);}
.foot-role{display:block; font-size:10.5px; color:var(--sb-ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.foot-status{color:var(--sb-ink-faint); display:flex; align-items:center; font-size:10.5px; margin-top:1px;}
.status-dot{width:6px; height:6px; border-radius:50%; background:var(--success); display:inline-block; margin-right:5px; box-shadow:0 0 0 3px rgba(46,158,107,.2); flex-shrink:0;}

/* ---- governance nav ---- */
.nav-section{margin-bottom:15px;}
.nav-section + .nav-section{padding-top:3px; border-top:1px solid var(--sb-border);}
.nav-section-title{font-size:10px; letter-spacing:.07em; color:var(--sb-ink-faint); font-weight:700; padding:9px 8px 6px; text-transform:uppercase;}
.nav-item{display:flex; align-items:center; gap:10px; padding:7px 8px; margin-bottom:1px; border-radius:9px; cursor:pointer; background:none; border:1px solid transparent; width:100%; text-align:left; color:inherit; transition:background .15s,border-color .15s;}
.nav-item:hover{background:var(--sb-surface);}
.nav-item.active{background:rgba(0,160,227,.14); border-color:rgba(0,160,227,.32);}
:root[data-theme="dark"] .nav-item.active{box-shadow:var(--glow);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav-item.active{box-shadow:var(--glow);}}
.nav-item-icon{width:27px; height:27px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--sb-surface); color:var(--sb-ink-soft); transition:background .15s,color .15s;}
.nav-item.active .nav-item-icon{background:var(--azure); color:#00152E;}
.nav-item-meta{flex:1; min-width:0;}
.nav-item-label{font-size:12.5px; font-weight:600; color:var(--sb-ink); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-sub{font-size:10px; color:var(--sb-ink-faint); margin-top:1px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.nav-subtoggle{display:flex; align-items:center; justify-content:space-between; width:100%; padding:8px 8px 6px; margin-top:2px; background:none; border:none; color:var(--sb-ink-soft); font-size:10.5px; font-weight:700; letter-spacing:.03em; cursor:pointer; border-radius:7px;}
.nav-subtoggle:hover{color:var(--sb-ink);}
.nav-subtoggle .chev{color:var(--sb-ink-faint);}

/* ---- panels ---- */
.view-panel{display:flex; flex-direction:column; gap:22px;}
.panel-head{display:flex; flex-direction:column; gap:4px;}
.panel-head h2{font-family:var(--font-display); font-size:20px; font-weight:600; margin:0; color:var(--ink);}
.panel-head p{font-size:12.5px; color:var(--ink-soft); margin:0;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
.stat-tile{background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-lg); padding:14px 16px; -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%); box-shadow:var(--shadow);}
.stat-tile .stat-label{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
.stat-tile .stat-value{font-family:var(--font-display); font-size:23px; font-weight:600; margin-top:5px; color:var(--ink);}
.stat-tile .stat-delta{font-size:11px; margin-top:4px; color:var(--success); font-weight:600;}

.panel-card{background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-lg); box-shadow:var(--shadow); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%); overflow:hidden;}
.panel-card-head{padding:13px 15px 11px; font-size:12.5px; font-weight:700; color:var(--ink); border-bottom:1px solid var(--glass-border);}

.audit-row, .access-row, .cloud-row{display:flex; align-items:center; gap:12px; padding:11px 15px; border-bottom:1px solid var(--glass-border); font-size:12.5px; flex-wrap:wrap;}
.audit-row:last-child, .access-row:last-child, .cloud-row:last-child{border-bottom:none;}
.audit-status{font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:var(--r-pill); flex-shrink:0;}
.audit-status.ok{background:rgba(46,158,107,.14); color:var(--success);}
.audit-status.flag{background:rgba(192,57,43,.12); color:var(--danger);}
.audit-time{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; width:44px; flex-shrink:0;}
.audit-rule{flex:1 1 280px; min-width:0; color:var(--ink);}
.audit-agent{color:var(--ink-soft); font-size:11px; flex-shrink:0;}

.access-dept{font-weight:600; width:170px; flex-shrink:0; color:var(--ink);}
.access-profiles{flex:1 1 220px; color:var(--ink-soft); min-width:0;}
.access-level{font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:var(--r-pill); flex-shrink:0;}
.access-level.full{background:rgba(0,160,227,.12); color:var(--azure-dim);}
.access-level.restrict{background:rgba(14,92,82,.14); color:var(--petrol);}

.cloud-name{display:flex; align-items:center; gap:9px; font-weight:600; flex:1 1 240px; min-width:0; color:var(--ink);}
.cloud-dot{width:7px; height:7px; border-radius:50%; background:var(--success); flex-shrink:0; box-shadow:0 0 0 3px rgba(46,158,107,.18);}
.cloud-detail{font-size:11px; color:var(--ink-faint);}

.settings-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 15px; border-bottom:1px solid var(--glass-border);}
.settings-row:last-child{border-bottom:none;}
.settings-label{display:flex; align-items:center; gap:10px;}
.settings-label b{display:block; font-size:12.5px; font-weight:600; color:var(--ink);}
.settings-label span{font-size:11px; color:var(--ink-faint);}
.mini-toggle{width:38px; height:22px; border-radius:999px; background:var(--line); border:none; position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
.mini-toggle.on{background:var(--azure);}
.mini-toggle::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.mini-toggle.on::after{transform:translateX(16px);}

.agenda-tabs{display:flex; gap:8px;}
.agenda-tab{padding:7px 14px; border-radius:var(--r-pill); border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--ink-soft); font-size:12px; font-weight:600; cursor:pointer; transition:background .15s,color .15s,border-color .15s;}
.agenda-tab.active{background:var(--navy-900); color:#fff; border-color:var(--navy-900);}
.agenda-tab:not(.active):hover{color:var(--ink); border-color:rgba(0,160,227,.35);}

.agenda-item{display:flex; gap:14px; padding:13px 15px; border-bottom:1px solid var(--glass-border);}
.agenda-item:last-child{border-bottom:none;}
.agenda-time-col{display:flex; flex-direction:column; align-items:flex-end; width:46px; flex-shrink:0; padding-top:1px;}
.agenda-time{font-size:12px; font-weight:700; color:var(--ink);}
.agenda-time-end{font-size:10px; color:var(--ink-faint); margin-top:1px;}
.agenda-line{width:3px; border-radius:3px; align-self:stretch; flex-shrink:0;}
.agenda-body{flex:1; min-width:0;}
.agenda-title{font-size:13px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.agenda-live{font-size:9.5px; font-weight:700; letter-spacing:.03em; color:var(--success); background:rgba(46,158,107,.14); padding:2px 8px; border-radius:var(--r-pill); text-transform:uppercase;}
.agenda-meta{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; flex-wrap:wrap;}
.agenda-location{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-faint);}
.agenda-avatars{display:flex;}
.agenda-avatar{width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:700; color:#fff; border:2px solid var(--panel-2); margin-left:-6px;}
.agenda-avatar:first-child{margin-left:0;}

.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 26px;
  border-bottom:1px solid var(--glass-border); background:var(--glass-bg);
  -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
  padding-top:calc(12px + env(safe-area-inset-top,0px)); position:relative; z-index:2;
}
.topbar-title h1{font-family:var(--font-display);}
.hamburger{display:none; width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-soft); align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.topbar-title{display:flex; align-items:center; gap:11px; min-width:0;}
.topbar-title h1{font-size:16.5px; margin:0; font-weight:600; letter-spacing:-.2px;}
.topbar-title .sub{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
.badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:var(--r-pill); background:rgba(46,158,107,.12); color:var(--success); border:1px solid rgba(46,158,107,.3); display:inline-flex; align-items:center; gap:5px; margin-left:8px;}
.badge .status-dot{margin:0;}
.topbar-right{display:flex; align-items:center; gap:10px;}

.clock-pill{display:flex; align-items:center; gap:6px; padding:0 11px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-soft); font-size:12px; font-variant-numeric:tabular-nums; flex-shrink:0;}
.clock-pill svg{color:var(--ink-faint); flex-shrink:0;}
@media (max-width:640px){.clock-pill{display:none;}}

.avatar-upload{position:relative; border:none; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; overflow:hidden; font-family:inherit;}
.avatar-upload img{width:100%; height:100%; object-fit:cover;}
.avatar-edit{position:absolute; inset:0; background:rgba(0,10,30,.55); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; color:#fff; border-radius:inherit;}
.avatar-upload:hover .avatar-edit, .avatar-upload:focus-visible .avatar-edit{opacity:1;}

.theme-switch{display:flex; align-items:center; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px; gap:2px;}
.theme-switch button{display:flex; align-items:center; justify-content:center; width:30px; height:28px; border-radius:var(--r-pill); border:none; background:transparent; color:var(--ink-faint); cursor:pointer; transition:background .15s, color .15s;}
.theme-switch button.active{background:var(--navy-900); color:#fff;}

.user-card{display:flex; align-items:center; gap:10px; padding:5px 12px 5px 5px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--panel-2);}
.user-avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--navy-900),var(--azure)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.user-card .info{line-height:1.25;}
.user-card .info b{display:block; font-size:12.5px; font-weight:600;}
.user-card .info .role{font-size:10.5px; color:var(--ink-faint);}
.user-card .info .active-tag{font-size:10px; color:var(--success); font-weight:600; display:flex; align-items:center; margin-top:1px;}

.logout-btn{display:flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-soft); font-size:12px; font-weight:600; cursor:pointer; transition:background .15s, color .15s, border-color .15s; flex-shrink:0;}
.logout-btn:hover{background:rgba(192,57,43,.08); color:var(--danger); border-color:rgba(192,57,43,.3);}
.logout-btn span{display:none;}
@media (min-width:640px){.logout-btn span{display:inline;}}

.chat-scroll{flex:1; overflow-y:auto; padding:26px 0 14px;}
.chat-inner{max-width:740px; margin:0 auto; padding:0 26px; display:flex; flex-direction:column; gap:30px;}

.context-strip{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1px solid var(--glass-border); background:var(--glass-bg); -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%); border-radius:var(--r-md); font-size:12px; color:var(--ink-soft); animation:rise .4s ease both;}
.context-strip b{color:var(--ink); font-weight:600;}
.greet-tag{font-weight:700; padding:2.5px 10px; border-radius:var(--r-pill); margin-right:1px; display:inline-block;}
.greet-tag.manha{background:rgba(169,130,76,.18); color:#A9824C;}
.greet-tag.tarde{background:rgba(0,160,227,.16); color:var(--azure-dim);}
.greet-tag.noite{background:rgba(4,10,28,.85); color:#AFCBEF;}

@keyframes rise{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;}}

.msg{display:flex; gap:10px; max-width:100%; animation:rise .48s cubic-bezier(.16,1,.3,1) both;}
.msg.assistant{justify-content:flex-start;}
.msg.user{justify-content:flex-end;}
.msg.user .msg-body{align-items:flex-end;}
.msg.user .msg-head{flex-direction:row-reverse;}
.msg-avatar{width:32px; height:32px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.msg-avatar.round{border-radius:50%;}
.msg.user .msg-avatar{background:linear-gradient(135deg,var(--navy-900),var(--azure)); color:#fff; font-size:12px; font-weight:700;}
.msg-avatar-wrap{position:relative; flex-shrink:0;}
.msg-avatar-badge{position:absolute; right:-3px; bottom:-3px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; border:2px solid var(--bg); box-shadow:0 1px 3px rgba(0,0,0,.25);}
.msg-avatar-badge.badge-upload{background:var(--azure);}
.msg-avatar-badge.badge-sql{background:var(--petrol);}
.msg-avatar-badge.badge-nosql{background:var(--bronze-dim);}
.msg-avatar-badge.badge-ml{background:var(--navy-900);}
.msg-body{flex:0 1 auto; max-width:76%; min-width:0; display:flex; flex-direction:column;}
@media (max-width:640px){.msg-body{max-width:88%;}}
.msg-head{display:flex; align-items:baseline; gap:8px; margin-bottom:5px;}
.msg-name{font-size:12.5px; font-weight:700; color:var(--ink);}
.msg-time{font-size:10.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
.msg-card{
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:19px; padding:12px 16px;
  box-shadow:var(--shadow); transition:box-shadow .2s;
  -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
}
:root[data-theme="dark"] .msg-card{box-shadow:var(--shadow), var(--glow);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg-card{box-shadow:var(--shadow), var(--glow);}}
.msg.assistant .msg-card{border-bottom-left-radius:6px;}
.msg.user .msg-card{
  background:linear-gradient(135deg,var(--navy-900),var(--azure));
  border-color:rgba(255,255,255,.14); border-bottom-right-radius:6px;
  box-shadow:var(--shadow), 0 10px 26px -14px rgba(0,80,160,.55);
}
.msg.user .msg-card .msg-text{color:#fff;}
.msg-card.arrived{animation:arrive-glow 1.2s ease-out;}
@keyframes arrive-glow{
  0%{box-shadow:0 0 0 1px rgba(0,160,227,.65), 0 0 26px rgba(0,160,227,.4), var(--shadow);}
  100%{box-shadow:var(--shadow);}
}
.msg-text{font-size:14px; line-height:1.62; color:var(--ink); white-space:pre-wrap;}
.caret{display:inline-block; width:2px; height:14px; background:var(--azure); margin-left:1px; vertical-align:-2px; animation:caret-blink 1s step-end infinite;}
@keyframes caret-blink{0%,100%{opacity:1;} 50%{opacity:0;}}

.trace{display:flex; flex-direction:column; margin-bottom:12px; padding:11px 13px 11px 12px; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--r-md);}
.trace-step{display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--ink-faint); padding:3px 0; position:relative;}
.trace-step:not(:last-child){padding-bottom:9px;}
.trace-step:not(:last-child)::before{content:""; position:absolute; left:2.5px; top:15px; width:1px; height:calc(100% - 6px); background:var(--line);}
.trace-step .dot{width:6px; height:6px; border-radius:50%; background:var(--azure); flex-shrink:0; position:relative; z-index:1;}
.trace-step.done{color:var(--ink-soft);}
.trace-step.done .dot{background:var(--success);}

.sources{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;}
.source-pill{font-size:11px; padding:4px 10px; border-radius:var(--r-pill); background:rgba(0,30,97,.05); color:var(--navy-900); border:1px solid rgba(0,30,97,.14); font-family:'IBM Plex Mono',monospace; display:inline-flex; align-items:center; gap:5px;}
:root[data-theme="dark"] .source-pill{background:rgba(0,160,227,.1); color:var(--azure); border-color:rgba(0,160,227,.28);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .source-pill{background:rgba(0,160,227,.1); color:var(--azure); border-color:rgba(0,160,227,.28);}}

.followup-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--glass-border); animation:rise .3s ease both;}
.followup-label{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); width:100%;}
.followup-chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:6.5px 12px; border-radius:var(--r-pill); border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--ink-soft); cursor:pointer; transition:background .15s, border-color .15s, color .15s, transform .15s;}
.followup-chip svg{flex-shrink:0; opacity:.85;}
.followup-chip:hover{background:rgba(0,160,227,.12); border-color:rgba(0,160,227,.42); color:var(--ink); transform:translateY(-1px);}
.followup-hint{font-size:11px; color:var(--ink-faint); width:100%; margin-top:2px;}

.confidence{display:flex; align-items:center; gap:7px; margin-top:11px; font-size:11px; color:var(--ink-faint);}
.confidence-bar{width:70px; height:4px; border-radius:3px; background:var(--line); overflow:hidden;}
.confidence-fill{height:100%; background:var(--success); border-radius:3px; transition:width .6s ease;}
.confidence b{font-variant-numeric:tabular-nums; color:var(--ink-soft);}

.ml-card{border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; background:var(--panel-2); padding:13px 14px; margin-bottom:12px;}
.ml-card-head{display:flex; align-items:center; gap:7px; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:13px;}
.ml-card-head svg{color:var(--azure); flex-shrink:0;}
.ml-hybrid-badge{margin-left:auto; font-size:9.5px; font-weight:600; color:var(--ink-faint); background:var(--panel); border:1px solid var(--line); padding:2px 8px; border-radius:var(--r-pill); white-space:nowrap;}
.ml-score-row{display:flex; align-items:center; gap:14px; margin-bottom:15px;}
.ml-score-ring{position:relative; width:52px; height:52px; flex-shrink:0;}
.ml-score-ring svg{transform:rotate(-90deg); display:block;}
.ring-bg{fill:none; stroke:var(--line); stroke-width:3;}
.ring-fill{fill:none; stroke:var(--azure); stroke-width:3; stroke-linecap:round; transition:stroke-dasharray .9s cubic-bezier(.16,1,.3,1);}
.ml-score-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
.ml-score-title{font-size:13px; font-weight:700; color:var(--ink);}
.ml-score-sub{font-size:11px; color:var(--ink-faint); margin-top:2px; max-width:300px; line-height:1.4;}
.ml-features{display:flex; flex-direction:column; gap:8px;}
.ml-feature-row{display:grid; grid-template-columns:120px 1fr 30px; align-items:center; gap:8px; font-size:11px; color:var(--ink-soft);}
.ml-feature-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ml-feature-bar{height:5px; border-radius:3px; background:var(--line); overflow:hidden;}
.ml-feature-fill{height:100%; background:var(--azure); border-radius:3px; transition:width .8s cubic-bezier(.16,1,.3,1);}
.ml-feature-pct{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-faint);}

.sql-card{border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; background:var(--panel-2); margin-bottom:12px;}
.sql-card-head{display:flex; align-items:center; gap:7px; padding:8px 12px; font-size:11px; font-weight:600; color:var(--ink-soft); border-bottom:1px solid var(--line);}
.sql-card-head svg{color:var(--azure); flex-shrink:0;}
.sql-exec-badge{margin-left:auto; font-size:10px; color:var(--success); background:rgba(46,158,107,.1); padding:2px 7px; border-radius:var(--r-pill); border:1px solid rgba(46,158,107,.25); font-variant-numeric:tabular-nums;}
.sql-code{margin:0; padding:12px 14px; background:#071224; color:#D7E2F5; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.65; overflow-x:auto; white-space:pre;}
.sql-kw{color:#5CC7FF; font-weight:600;}
.sql-str{color:#F2B15C;}
.sql-num{color:#8FD6A8;}
.sql-result{padding:12px 13px 13px;}
.sql-result-label{font-size:11px; color:var(--ink-faint); margin-bottom:8px;}
.sql-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-sm);}
.sql-table{border-collapse:collapse; width:100%; font-size:12px; font-family:'IBM Plex Mono',monospace;}
.sql-table th{text-align:left; padding:7px 10px; background:var(--panel); color:var(--ink-faint); font-weight:600; font-size:10.5px; border-bottom:1px solid var(--line); white-space:nowrap;}
.sql-table td{padding:7px 10px; border-bottom:1px solid var(--line-soft); color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; background:var(--panel);}
.sql-table tr:last-child td{border-bottom:none;}

.upload-card{display:flex; flex-direction:column; gap:10px; min-width:220px;}
.upload-file{display:flex; align-items:center; gap:10px;}
.upload-file-icon{width:34px; height:34px; border-radius:9px; background:rgba(192,57,43,.1); color:#C0392B; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.upload-file-name{font-size:13px; font-weight:600; color:var(--ink);}
.upload-file-meta{font-size:11px; color:var(--ink-faint); margin-top:1px;}
.upload-progress-bar{height:5px; border-radius:3px; background:var(--line); overflow:hidden;}
.upload-progress-fill{height:100%; background:var(--azure); border-radius:3px; transition:width .45s ease;}
.upload-status{font-size:11.5px; color:var(--ink-soft);}
.upload-status.done{color:var(--success); font-weight:600;}

.doc-chip{display:flex; align-items:center; gap:7px; max-width:740px; margin:0 auto 9px; padding:6px 8px 6px 11px; border-radius:var(--r-pill); background:var(--panel-2); border:1px solid var(--line); font-size:11.5px; color:var(--ink-soft); width:fit-content;}
.doc-chip svg{color:#C0392B; flex-shrink:0;}
.doc-chip button{border:none; background:none; color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; padding:3px; border-radius:50%; flex-shrink:0;}
.doc-chip button:hover{background:var(--line-soft); color:var(--ink);}

.typing{display:flex; gap:4px; padding:3px 0;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation:blink 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}

/* ---------------- hooks ---------------- */
function useTheme(): [string, () => void] {
  const [theme, setTheme] = React.useState<string>(() => {
    try { return localStorage.getItem('hmbank-theme') || ''; } catch { return ''; }
  });
  React.useEffect(() => {
    if (theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
  }, [theme]);
  const set = (t: string) => {
    setTheme(t);
    try { localStorage.setItem('hmbank-theme', t); } catch {}
  };
  return [theme, () => set(theme === 'dark' ? 'light' : 'dark')] as any;
}

function useTypewriter(fullText: string, active: boolean, speed = 14) {
  const [shown, setShown] = React.useState(active ? '' : fullText);
  const [done, setDone] = React.useState(!active);
  React.useEffect(() => {
    if (!active) { setShown(fullText); setDone(true); return; }
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { setShown(fullText); setDone(true); return; }
    setShown('');
    setDone(false);
    let i = 0;
    const id = setInterval(() => {
      i += 2;
      if (i >= fullText.length) {
        setShown(fullText);
        setDone(true);
        clearInterval(id);
      } else {
        setShown(fullText.slice(0, i));
      }
    }, speed);
    return () => clearInterval(id);
  }, [fullText, active]);
  return { shown, done };
}

function useArrivalGlow(trigger: boolean, animate: boolean) {
  const [glow, setGlow] = React.useState(false);
  const firedRef = React.useRef(false);
  React.useEffect(() => {
    if (animate && trigger && !firedRef.current) {
      firedRef.current = true;
      setGlow(true);
      const t = setTimeout(() => setGlow(false), 1200);
      return () => clearTimeout(t);
    }
  }, [trigger, animate]);
  return glow;
}

const TraceTimeline: React.FC<{ steps: string[]; active: boolean }> = ({ steps, active }) => {
  const [doneCount, setDoneCount] = React.useState(active ? 0 : steps.length);
  React.useEffect(() => {
    if (!active) { setDoneCount(steps.length); return; }
    setDoneCount(0);
    const timers = steps.map((_, i) => setTimeout(() => setDoneCount(c => Math.max(c, i + 1)), (i + 1) * 480));
    return () => timers.forEach(clearTimeout);
  }, [steps, active]);
  return (
    <div className="trace">
      {steps.map((s, i) => (
        <div key={i} className={'trace-step' + (i < doneCount ? ' done' : '')}>
          <span className="dot" />{s}
        </div>
      ))}
    </div>
  );
};

const SQL_KEYWORDS = new Set(['SELECT', 'FROM', 'WHERE', 'JOIN', 'LEFT', 'RIGHT', 'INNER', 'ON', 'ORDER', 'BY', 'GROUP', 'LIMIT', 'AND', 'OR', 'AS', 'IN', 'BETWEEN', 'DESC', 'ASC', 'COUNT', 'SUM', 'AVG', 'DISTINCT', 'INSERT', 'INTO', 'VALUES', 'UPDATE', 'SET', 'NULL', 'NOT', 'LIKE', 'CURRENT_DATE', 'INTERVAL']);

function highlightSQL(sql: string): React.ReactNode[] {
  const tokens = sql.split(/(\s+)/);
  return tokens.map((t, i) => {
    const clean = t.replace(/[(),;]/g, '');
    const upper = clean.toUpperCase();
    if (SQL_KEYWORDS.has(upper)) return <span key={i} className="sql-kw">{t}</span>;
    if (/^'.*'$/.test(t)) return <span key={i} className="sql-str">{t}</span>;
    if (/^-?\d+(\.\d+)?$/.test(clean) && clean.length > 0) return <span key={i} className="sql-num">{t}</span>;
    return <React.Fragment key={i}>{t}</React.Fragment>;
  });
}

const INDEX_STEPS = ['Extraindo texto do PDF', 'Dividindo em chunks semânticos', 'Gerando embeddings', 'Indexando no vector database'];

const UploadCard: React.FC<{ msg: ChatMessage }> = ({ msg }) => {
  const startedIndexing = React.useRef(msg.status === 'indexing').current;
  const [stepIndex, setStepIndex] = React.useState(startedIndexing ? 0 : INDEX_STEPS.length);
  React.useEffect(() => {
    if (!startedIndexing) return;
    const timers = INDEX_STEPS.map((_, i) => setTimeout(() => setStepIndex(c => Math.max(c, i + 1)), (i + 1) * 520));
    return () => timers.forEach(clearTimeout);
  }, []);
  const pct = Math.round((stepIndex / INDEX_STEPS.length) * 100);
  const doneLabel = (msg.chunks || 0) + ' chunks indexados · pronto para consulta via RAG';
  return (
    <div className="upload-card">
      <div className="upload-file">
        <div className="upload-file-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /></svg>
        </div>
        <div>
          <div className="upload-file-name">{msg.fileName}</div>
          <div className="upload-file-meta">{msg.fileSizeKB} KB · {msg.pages} páginas</div>
        </div>
      </div>
      <div className="upload-progress-bar"><div className="upload-progress-fill" style={{ width: pct + '%' }} /></div>
      <div className={'upload-status' + (pct >= 100 ? ' done' : '')}>
        {pct >= 100 ? doneLabel : INDEX_STEPS[Math.min(stepIndex, INDEX_STEPS.length - 1)]}
      </div>
    </div>
  );
};

  }, [animate, msg.thinkMs]);
  const { shown, done } = useTypewriter(msg.text || '', animate && reveal, 12);
  const ready = done || !animate;

                {animate ? shown : msg.text}
                {animate && reveal && !done && <span className="caret" />}

const MessageBubble: React.FC<{ msg: ChatMessage; agent: AgentDef; animate: boolean; userName: string; isLast?: boolean; onDeepen?: () => void; onExportPdf?: () => void; onExportData?: () => void }> = ({ msg, agent, animate, userName, isLast, onDeepen, onExportPdf, onExportData }) => {
  const isUser = msg.role === 'user';
  if (msg.kind === 'upload') {
    return (
      <div className="msg assistant">
        <AvatarWithBadge agent={agent} size={32} kind="upload" />
        <div className="msg-body">
          <div className="msg-head"><span className="msg-name">{agent.name}</span><span className="msg-time">{msg.time}</span></div>
          <div className="msg-card"><UploadCard msg={msg} /></div>
        </div>
      </div>
    );
  }
  if (msg.kind === 'sql') {
    return <SQLMessage msg={msg} agent={agent} animate={animate} />;
  }
  if (msg.kind === 'nosql') {
    return <NoSQLMessage msg={msg} agent={agent} animate={animate} />;
  }
  if (msg.kind === 'ml') {
    return <MLMessage msg={msg} agent={agent} animate={animate} />;
  }
  const [showText, setShowText] = React.useState(!animate);
  React.useEffect(() => {
    if (!animate) { setShowText(true); return; }
    const delay = msg.thinkMs !== undefined ? msg.thinkMs : 1800;
    const t = setTimeout(() => setShowText(true), delay);
    return () => clearTimeout(t);
  }, [animate, msg.thinkMs]);
  const { shown, done } = useTypewriter(msg.text, animate && showText, 12);
  const glow = useArrivalGlow(showText, animate);

  return (
    <div className={'msg ' + (isUser ? 'user' : 'assistant')}>
      {isUser
        ? <div className="msg-avatar">HM</div>
        : <AvatarWithBadge agent={agent} size={32} />}
      <div className="msg-body">
        <div className="msg-head">
          <span className="msg-name">{isUser ? userName : agent.name}</span>
          <span className="msg-time">{msg.time}</span>
          {!isUser && (done || !animate) && <span className="model-badge">llm-plataforma-v4.2 · RAG v2.3</span>}
        </div>
        <div className={'msg-card' + (!isUser && glow ? ' arrived' : '')}>
          {!isUser && animate && !showText ? (
            <div className="thinking"><span className="thinking-orb" /><span className="thinking-label">Pensando…</span></div>
          ) : (
            <div className="msg-text">
              {isUser ? msg.text : shown}
              {!isUser && animate && showText && !done && <span className="caret" />}
            </div>
          )}
          {!isUser && (done || !animate) && msg.confidence !== undefined && (
            <div className="confidence">
              <span>Confiança da resposta</span>
              <div className="confidence-bar"><div className="confidence-fill" style={{ width: msg.confidence + '%' }} /></div>
              <b>{msg.confidence}%</b>
            </div>
          )}
          {!isUser && (done || !animate) && msg.sources && (
            <div className="sources">
              {msg.sources.map((s, i) => <span key={i} className="source-pill">{s}</span>)}
            </div>
          )}
        </div>
        {!isUser && isLast && (done || !animate) && (
          <div className="followup-row">
            <span className="followup-label">Quer ir além?</span>
            <button className="followup-chip" onClick={onDeepen}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /><path d="M11 8v6M8 11h6" /></svg>
              Aprofundar esta análise
            </button>
            <button className="followup-chip" onClick={onExportPdf}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" /><path d="M14 2v5h5M8 13h8M8 17h5" /></svg>
              Gerar PDF desta resposta
            </button>
            <button className="followup-chip" onClick={onExportData}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><ellipse cx="12" cy="5" rx="8" ry="3" /><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5" /><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" /></svg>
              Exportar dados
            </button>
            <span className="followup-hint">Ficou alguma dúvida? É só perguntar por aqui.</span>
          </div>
        )}
      </div>
    </div>
  );
};

function classifyRoute(text: string): string {
  const lower = text.toLowerCase();
  for (const r of ROUTES) if (r.kws.some(k => lower.includes(k))) return r.id;
  return 'beto';
}

function shortQuote(text: string, max = 68): string {

  return t.length > max ? t.slice(0, max - 1).trimEnd() + '…' : t;

  profile: string; setProfile: (id: string) => void;
  email: string; setEmail: (v: string) => void;
  password: string; setPassword: (v: string) => void;
}> = ({ authing, onSubmit, profile, setProfile, email, setEmail, password, setPassword }) => {
  const canSubmit = (email.trim().length > 3 && password.trim().length > 0) || !!profile;
  return (
    <div className="login-screen">
      <div className="login-glow" />
      <div className="login-card-wrap">
      <div className="login-card">
        <div className="login-logo-row">
          <div className="mark-avatar" style={{ width: 36, height: 36, borderRadius: 10 }}><Arc size={19} /></div>
          <div><b>Plataforma de IA</b><span>Acesso corporativo · HM Bank</span></div>
        </div>
        <h1 className="login-title">Bem-vinda de volta</h1>
        <p className="login-sub">Entre com sua conta corporativa para acessar a plataforma.</p>

        <button className="sso-btn" onClick={onSubmit} disabled={authing}>
          {authing ? <span className="spinner" /> : (
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2"><rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
          )}
          {authing ? 'Autenticando...' : 'Entrar com SSO Corporativo'}
        </button>

        <div className="login-divider">ou continue com e-mail corporativo</div>

        <div className="field">
          <label htmlFor="login-email">E-mail corporativo</label>
          <input id="login-email" type="email" placeholder="nome.sobrenome@hmbank.com" value={email} onChange={e => setEmail(e.target.value)} />
        </div>
        <div className="field">
          <label htmlFor="login-password">Senha</label>
          <input id="login-password" type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} />
        </div>
        <p className="login-demo-hint">Credenciais de demonstração já preenchidas — é só clicar em <b>Entrar</b>.</p>

        <div className="profile-label">Acessar como</div>
        <div className="profile-picker">
          {LOGIN_PROFILES.map(p => (
            <button
              key={p.id} type="button"
              className={'profile-chip' + (profile === p.id ? ' active' : '')}
              onClick={() => setProfile(profile === p.id ? '' : p.id)}
            >
              <p.glyph size={15} color="currentColor" />
              {p.label}
            </button>
          ))}
        </div>

        <button className="login-submit" disabled={!canSubmit || authing} onClick={onSubmit}>
          {authing && <span className="spinner dark" />}
          {authing ? 'Autenticando...' : 'Entrar'}
        </button>

        <p className="login-note">Ambiente de demonstração · autenticação simulada para fins de portfólio</p>
      </div>
      </div>
    </div>
  );
};

  const [rosterOpen, setRosterOpen] = React.useState(true);

  const [queryCount, setQueryCount] = React.useState(4821);
  const [listening, setListening] = React.useState(false);
  const [micSupported, setMicSupported] = React.useState(true);
  const [micHint, setMicHint] = React.useState('');
  const [doc, setDoc] = React.useState<DocContext | null>(null);
  const [clock, setClock] = React.useState(() => new Date());
  const [avatarUrl, setAvatarUrl] = React.useState<string>(() => {

  });
  const [toast, setToast] = React.useState<{ kind?: 'colleague' | 'export'; name: string; initials: string; color: string; text: string; icon?: string } | null>(null);
  const [squadOpen, setSquadOpen] = React.useState(false);
  const [squad, setSquad] = React.useState(SQUADS[0]);

  const fileInputRef = React.useRef<HTMLInputElement>(null);

  const avatarInputRef = React.useRef<HTMLInputElement>(null);

  React.useEffect(() => {
    setIsMac(/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent));
    const onKeyDown = (e: KeyboardEvent) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setPaletteOpen(o => !o);
      }
      if (e.key === 'Escape') {
        setPaletteOpen(false);
        setSquadOpen(false);
        setAttachMenuOpen(false);
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  React.useEffect(() => {
    const id = setInterval(() => setClock(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const timeStr = clock.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const nowHM = clock.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const greetKind = clock.getHours() < 12 ? 'manha' : clock.getHours() < 18 ? 'tarde' : 'noite';
  const greetLabel = greetKind === 'manha' ? 'Bom dia' : greetKind === 'tarde' ? 'Boa tarde' : 'Boa noite';

  React.useEffect(() => {
    if (!authed) return;
    let cancelled = false;
    const scheduleNext = () => {
      const delay = 35000 + Math.random() * 40000;
      const t = setTimeout(() => {
        if (cancelled) return;
        const pick = TOAST_POOL[Math.floor(Math.random() * TOAST_POOL.length)];
        setToast(pick);
        const hideT = setTimeout(() => setToast(null), 6000);
        scheduleNext();
      }, delay);
      return t;
    };
    const first = setTimeout(() => { if (!cancelled) { setToast(TOAST_POOL[0]); setTimeout(() => setToast(null), 6000); } }, 14000);
    const loopId = scheduleNext();
    return () => { cancelled = true; clearTimeout(first); clearTimeout(loopId); };
  }, [authed]);

  React.useEffect(() => {
    if (!authed) return;
    setPanelLoading(true);
    const t = setTimeout(() => setPanelLoading(false), 360);
    return () => clearTimeout(t);
  }, [view, activeId, authed]);

  const onAvatarChosen = (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const url = String(reader.result);
      setAvatarUrl(url);
      try { localStorage.setItem('hmbank-avatar', url); } catch {}
    };
    reader.readAsDataURL(file);
  };

  const renderAvatar = (size: number, className: string) => (
    <button
      type="button" className={className + ' avatar-upload'} style={{ width: size, height: size }}
      onClick={() => avatarInputRef.current?.click()} aria-label="Alterar foto de perfil" title="Alterar foto de perfil"
    >
      {avatarUrl ? <img src={avatarUrl} alt="" /> : 'HM'}
      <span className="avatar-edit">
        <svg width={Math.round(size * 0.4)} height={Math.round(size * 0.4)} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z" /><circle cx="12" cy="13" r="3.5" /></svg>
      </span>
    </button>
  );

  const agent = agentById(activeId);

  // dynamic tab title + favicon per active agent
  React.useEffect(() => {
    document.title = authed ? agent.name + ' · Plataforma de IA' : 'Plataforma de IA · HM Bank';
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      if (ctx) {
        ctx.beginPath(); ctx.arc(32, 32, 32, 0, Math.PI * 2);
        ctx.fillStyle = agent.id === 'beto' ? '#0B7FB5' : agent.color;
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '700 30px Inter, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(agent.name.charAt(0).toUpperCase(), 32, 35);
        const url = canvas.toDataURL('image/png');
        let link = document.querySelector('link[rel="icon"]') as HTMLLinkElement | null;
        if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
        link.href = url;
      }
    } catch {}
  }, [agent.id, agent.name, agent.color, authed]);

  // live latency + query counter ticking (simulated real-time telemetry)
  React.useEffect(() => {
    const id = setInterval(() => {
      setLatencies(prev => {
        const next = { ...prev };
        AGENTS.forEach(a => {
          const jitter = Math.floor(Math.random() * 14) - 7;
          next[a.id] = Math.max(18, (prev[a.id] ?? 50) + jitter);
        });
        return next;
      });
    }, 3200);
    const id2 = setInterval(() => setQueryCount(c => c + Math.floor(Math.random() * 3) + 1), 4500);
    return () => { clearInterval(id); clearInterval(id2); };
  }, []);

  React.useEffect(() => {
    scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
  }, [threads, activeId]);

  React.useEffect(() => {
    const SR = (window as any).SpeechRecognition || (window as any).webkitSpeechRecognition;
    if (!SR) { setMicSupported(false); return; }
    const rec = new SR();
    rec.lang = 'pt-BR';
    rec.continuous = false;
    rec.interimResults = true;
    rec.onstart = () => setListening(true);
    rec.onresult = (e: any) => {
      let t = '';
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      setInput(t);
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recognitionRef.current = rec;
  }, []);

  const onFileChosen = (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const name = file.name || 'politica_credito.pdf';
    const sizeKB = Math.max(96, Math.round(file.size / 1024)) || 248;
    const pages = Math.max(4, Math.round(sizeKB / 34));
    const chunks = pages * 3;
    const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const uploadMsg: ChatMessage = {
      id: 'up-' + Date.now(), role: 'agent', text: '', time,
      kind: 'upload', status: 'indexing', fileName: name, fileSizeKB: sizeKB, pages, chunks,
    };
    setThreads(prev => ({ ...prev, [activeId]: [...(prev[activeId] || []), uploadMsg] }));
    setTimeout(() => {
      setThreads(prev => ({
        ...prev,
        [activeId]: (prev[activeId] || []).map(m => m.id === uploadMsg.id ? { ...m, status: 'done' as const } : m),
      }));
      setDoc({ name, pages, chunks });
    }, INDEX_STEPS.length * 520 + 260);
  };

  const onFolderChosen = (e: React.ChangeEvent<HTMLInputElement>) => {
    const files = e.target.files;
    e.target.value = '';
    if (!files || files.length === 0) return;
    const count = files.length;
    let totalKB = 0;
    for (let i = 0; i < files.length; i++) totalKB += files[i].size / 1024;
    totalKB = Math.max(120, Math.round(totalKB)) || 320;
    const firstPath = (files[0] as any).webkitRelativePath as string | undefined;
    const folderName = (firstPath ? firstPath.split('/')[0] : files[0].name) || 'pasta';
    const pages = Math.max(count, Math.round(totalKB / 40));
    const chunks = pages * 3;
    const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const uploadMsg: ChatMessage = {
      id: 'up-' + Date.now(), role: 'agent', text: '', time,
      kind: 'upload', status: 'indexing', fileName: folderName + ' · ' + count + ' arquivo' + (count > 1 ? 's' : ''), fileSizeKB: totalKB, pages, chunks,
    };
    setThreads(prev => ({ ...prev, [activeId]: [...(prev[activeId] || []), uploadMsg] }));
    setTimeout(() => {
      setThreads(prev => ({
        ...prev,
        [activeId]: (prev[activeId] || []).map(m => m.id === uploadMsg.id ? { ...m, status: 'done' as const } : m),
      }));
      setDoc({ name: folderName, pages, chunks });
    }, INDEX_STEPS.length * 520 + 260);
  };

  const toggleMic = () => {
    if (!micSupported) {
      setMicHint('Reconhecimento de voz não suportado neste navegador');
      setTimeout(() => setMicHint(''), 2600);
      return;
    }
    if (listening) recognitionRef.current?.stop();
    else { try { recognitionRef.current?.start(); } catch {} }
  };

  const requestExport = (format: 'pdf' | 'xlsx') => {
    const fileName = format === 'pdf'
      ? 'analise-' + activeId + '-' + Date.now().toString().slice(-4) + '.pdf'
      : 'dados-' + activeId + '-' + Date.now().toString().slice(-4) + '.xlsx';
    setToast({
      kind: 'export',
      name: 'Exportação concluída',
      initials: '',
      color: 'var(--success)',
      icon: format === 'pdf' ? 'docs' : 'database',
      text: fileName + ' gerado por ' + agent.name + ' (demonstração de interface)',
    });
    setTimeout(() => setToast(null), 5200);
  };

  const send = (overrideText?: string) => {
    const text = (overrideText !== undefined ? overrideText : input).trim();
    if (!text) return;
    const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const userMsg: ChatMessage = { id: 'u-' + Date.now(), role: 'user', text, time };

    const lower = text.toLowerCase();
    const isGreeting = GREETING_RE.test(text.trim());
    const isThanks = !isGreeting && THANKS_RE.test(text.trim());
    const isFarewell = !isGreeting && !isThanks && FAREWELL_RE.test(text.trim());
    const isCapabilityQ = !isGreeting && !isThanks && !isFarewell && CAPABILITY_Q_RE.test(lower);
    const isHelp = !isGreeting && !isThanks && !isFarewell && !isCapabilityQ && HELP_RE.test(lower);
    const isRequestHelp = !isGreeting && !isThanks && !isFarewell && !isCapabilityQ && !isHelp && REQUEST_HELP_RE.test(lower);
    const isQuick = isGreeting || isThanks || isFarewell || isHelp || isCapabilityQ || isRequestHelp;
    const routedId = activeId === 'beto' ? classifyRoute(text) : activeId;
    const respondingAgent = agentById(routedId);
    const mlTrigger = !isQuick && ML_KEYWORDS.some(k => lower.includes(k));
    const nosqlTrigger = !isQuick && !mlTrigger && NOSQL_KEYWORDS.some(k => lower.includes(k));
    const sqlTrigger = !isQuick && !mlTrigger && !nosqlTrigger && (routedId === 'analista' || SQL_KEYWORDS_Q.some(k => lower.includes(k)));

    let trace: string[];
    if (isQuick) {
      trace = [];
    } else {
      trace = ['Analisando intenção via LLM'];
      if (activeId === 'beto') {
        trace.push(routedId !== 'beto' ? 'Roteando para ' + respondingAgent.name : 'Respondendo diretamente, sem necessidade de especialista');
      }
      if (sqlTrigger) trace.push('Gerando consulta SQL', 'Consultando banco relacional (RDS/PostgreSQL)');
      else if (nosqlTrigger) trace.push('Consultando banco não-relacional (DynamoDB)');
      else if (mlTrigger) trace.push('Executando modelo de Machine Learning clássico');
      else trace.push('Buscando contexto na base vetorial (RAG)');
      trace.push('Gerando resposta com o LLM da plataforma');
    }

    let agentMsg: ChatMessage;

    if (isGreeting) {
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, thinkMs: 3000,
        text: 'Oi, ' + USER_NAME.split(' ')[0] + ', tudo bem?',
        confidence: 97,
      };
    } else if (isThanks) {
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, thinkMs: 900,
        text: THANKS_REPLIES[Math.floor(Math.random() * THANKS_REPLIES.length)],
        confidence: 98,
      };
    } else if (isFarewell) {
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, thinkMs: 900,
        text: FAREWELL_REPLIES[Math.floor(Math.random() * FAREWELL_REPLIES.length)],
        confidence: 98,
      };
    } else if (isHelp) {
      const helpTopic = SUBTOPICS.beto[0];
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, thinkMs: 1400,
        text: activeId === 'beto'
          ? helpTopic.text
          : 'Sou ' + respondingAgent.name + ', especialista em ' + respondingAgent.subtitle.toLowerCase() + '. ' + (REPLIES[routedId]?.text || ''),
        confidence: 96,
      };
    } else if (isCapabilityQ) {
      const techNames = AGENTS.filter(a => a.area === 'tech').map(a => a.name).join(', ');
      const bizNames = AGENTS.filter(a => a.area === 'business').map(a => a.name).join(', ');
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, thinkMs: 1400,
        text: 'A plataforma tem ' + (AGENTS.length - 1) + ' especialistas, além de mim: em Tecnologia — ' + techNames + '; em Negócios — ' + bizNames + '. É só clicar em um deles na lateral ou me perguntar direto que eu já roteio.',
        confidence: 97,
      };
    } else if (isRequestHelp) {
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, thinkMs: 1100,
        text: REQUEST_HELP_REPLIES[Math.floor(Math.random() * REQUEST_HELP_REPLIES.length)],
        confidence: 95,
      };
    } else if (nosqlTrigger) {
      const isProfile = /perfil|cliente|preferê|prefere/.test(lower);
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, kind: 'nosql', trace,
        execMs: 6 + Math.floor(Math.random() * 9),
        nosqlTable: isProfile ? 'perfis_cliente' : 'sessoes_usuario',
        nosqlKey: isProfile ? 'cliente_id: "CX-4471"' : 'session_id: "sess_8f21ac"',
        nosqlItem: isProfile ? {
          cliente_id: 'CX-4471', segmento: 'Private', canal_preferido: 'App mobile', ultima_interacao: '2026-09-24T18:12:00Z',
        } : {
          session_id: 'sess_8f21ac', usuario: USER_NAME, agente_ativo: respondingAgent.name, expira_em: '2026-09-25T23:59:00Z',
        },
        text: isProfile
          ? 'Encontrei o perfil na tabela de chave-valor: cliente Private, canal preferido é o app mobile — dado que já veio pronto pra personalizar a resposta, sem precisar de JOIN.'
          : 'Recuperei a sessão ativa direto pela chave de partição — é assim que a plataforma mantém o contexto da conversa entre uma pergunta e outra, com latência de milissegundos.',
        confidence: 91 + Math.floor(Math.random() * 7),
        sources: ['dynamodb.' + (isProfile ? 'perfis_cliente' : 'sessoes_usuario')],
      };
    } else if (sqlTrigger) {
      const isWallet = /carteira|limite|transaç|transac/.test(lower);
      agentMsg = {
        id: 'a-' + Date.now(), role: 'agent', time, kind: 'sql', trace,
        execMs: 84 + Math.floor(Math.random() * 70),
        sqlQuery: isWallet
          ? "SELECT t.data_transacao, t.tipo, t.valor, c.limite_credito\nFROM transacoes t\nJOIN carteira_clientes c ON c.id = t.carteira_id\nWHERE c.id = 'CX-4471'\nORDER BY t.data_transacao DESC\nLIMIT 5;"
          : "SELECT produto, SUM(valor) AS receita\nFROM transacoes\nWHERE data_transacao >= CURRENT_DATE - INTERVAL '90 days'\nGROUP BY produto\nORDER BY receita DESC\nLIMIT 5;",
        columns: isWallet ? ['data_transacao', 'tipo', 'valor (R$)', 'limite_credito (R$)'] : ['produto', 'receita (R$)'],
        rows: isWallet ? [
          ['2026-09-18', 'compra', '1.240,00', '350.000,00'],
          ['2026-09-15', 'pagamento', '-3.800,00', '350.000,00'],
          ['2026-09-09', 'compra', '2.150,00', '350.000,00'],
          ['2026-09-02', 'estorno', '-410,00', '350.000,00'],
          ['2026-08-27', 'compra', '5.600,00', '350.000,00'],
        ] : [
          ['Crédito Corporativo', '18.420.000,00'], ['Cartões', '11.980.000,00'], ['Investimentos', '9.640.000,00'], ['Seguros', '4.310.000,00'], ['Câmbio', '3.250.000,00'],
        ],
        rowCount: 5,
        text: isWallet
          ? 'A carteira consultada está com limite de R$ 350.000,00 aprovado, sem ocorrências acima do limite nas últimas transações.'
          : 'Crédito Corporativo segue como o produto de maior receita nos últimos 90 dias — já deixo pronto pra exportar num dashboard.',
        confidence: 88 + Math.floor(Math.random() * 8),
        sources: doc ? ['rds-prod.transacoes', doc.name + ' · RAG'] : ['rds-prod.transacoes'],
      };
    } else if (mlTrigger) {
      const pick = ML_MODELS[routedId] || ML_MODELS.default;

        id: 'a-' + Date.now(), role: 'agent', time, kind: 'ml', trace,

        confidence: subtopic ? 87 + Math.floor(Math.random() * 9) : 78 + Math.floor(Math.random() * 13),
